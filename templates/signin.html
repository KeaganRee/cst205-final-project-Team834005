<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Music App!</title>
</head>
<body>
    <h1>Welcome to Music App!</h1>
    <p class="text-muted">Please sign in or create an account to continue.</p>

    <form method="POST" action="{{ url_for('signin') }}">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>
        <button type="submit">Sign In</button>
        <button type="create account">Create Account</button>
        <button type="hide/show password">Hide/Show Password</button>
    </form>

    <a href="{{ url_for('index') }}" class="card-link">Home</a>
</body>
</html>
